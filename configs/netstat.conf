input {
  http_poller {
    id => "monit_wlcg_sitenetwork"
    urls => {
      sitenetwork => {
        method  => post
        url     => "https://monit-grafana.cern.ch/api/datasources/proxy/10526/_msearch"
        headers => { "Content-Type" => "application/json" }
        body    => "{\"search_type\":\"query_then_fetch\",\"ignore_unavailable\":true,\"index\":[\"monit_prod_wlcg_raw_sitenetwork-*\"]}\n{\"size\":5000,\"track_total_hits\":true,\"_source\":[\"metadata.timestamp\",\"data.netsite\",\"data.site\",\"data.InBytesPerSec\",\"data.OutBytesPerSec\"],\"query\":{\"bool\":{\"filter\":[{\"range\":{\"metadata.timestamp\":{\"gte\":\"now-10m\",\"lte\":\"now-1m\"}}}]}},\"sort\":[{\"metadata.timestamp\":\"asc\"}]}\n"
      }
    }
    request_timeout => 120
    schedule        => { every => "5m" }
    codec           => "json"
  }
}

filter {
  if [responses][0][error] {
    mutate { add_tag => ["monit_query_error"] }
  } else {
    split {
      field  => "[responses][0][hits][hits]"
      target => "hit"
    }
    mutate {
      add_field => { "[@metadata][doc_id]" => "%{[hit][_index]}:%{[hit][_id]}" }
    }
    ruby {
      code => 'src = event.get("[hit][_source]") || {}; src.each { |k, v| event.set(k, v) }'
    }
    date {
      match  => ["[metadata][timestamp]", "UNIX_MS"]
      target => "@timestamp"
    }
    mutate { remove_field => ["hit", "responses", "@version"] }
  }
}

output {
  
  #  stdout {
  #    codec => rubydebug
  #  }

  elasticsearch {
    hosts => "atlas-kibana.mwt2.org"
    ssl_enabled => true
    index       => "wlcg-sitenetwork-%{+YYYY.MM}"
    document_id => "%{[@metadata][doc_id]}"
    action      => "index"
    user => "uc_logstash_indexer"
    password => "${LOGSTASH_PWD}"
  }
}

