input {
  http {
    # host => "0.0.0.0"
    port => "80"
  }
}

filter {
  
  mutate {
    remove_field => [ "headers" ]
  }

  json {
    source => "message"
    remove_field => [ "headers" ]
    remove_field => [ "message" ]
    remove_field => [ "port" ]
    tag_on_failure => ["_jsonparsefailure"]
  }
  
  mutate {
    remove_field => [ "counters" ]
    remove_field => [ "version" ]
    remove_field => [ "@version" ]
    remove_field => [ "host" ]
  }

  split {
    field => "cnt"
  }
  mutate {
    rename => { "[cnt][ip]" => "ip" }
    rename => { "[cnt][connections]" => "connections" }
    remove_field => ["cnt"]
  }

  
    memcached {
      id => "mem-var-get"
      hosts => ["memcached"]
      get => {
        "ip_%{ip}" => "[client]"
      }
    }
    
    if ![client]{
      ruby { path => "/usr/share/logstash/filters/resolve_host.rb" }

      mutate {
        rename => { "[source][client]" => "client" }
      }
      
      memcached {
        id => "mem-var-set"
        hosts => ["memcached"]
        ttl => 43200
        set => {
          "client" => "ip_%{ip}"
        }
      }
    }    

}

output {

  #  stdout {
  #    codec => rubydebug
  #  }

    if "_jsonparsefailure" in [tags] {
      file {
        path => "/var/log/logstash/varnish_jsonparsefailure.txt"
      }
    } else {
      elasticsearch {
        hosts => "atlas-kibana.mwt2.org"
        ssl => true
        index => 'varnish_accesses_write'
        user => "uc_logstash_indexer"
        password => "${LOGSTASH_PWD}"
      }

#        file {
#            path => "/var/log/logstash/correct.txt"
#        }

    }
  

}