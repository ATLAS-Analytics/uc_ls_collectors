input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS:message-exchange.es.net:9095}"
    topics => [ "${KAFKA_TOPIC:stardust_firefly}" ]
    group_id => "${KAFKA_GROUP_ID:firefly-cern-uccollect-consumer-01}"
    client_id => "${KAFKA_CLIENT_ID:uc-ls-fireflies}"
    auto_offset_reset => "${KAFKA_AUTO_OFFSET_RESET:latest}"
    consumer_threads => "${KAFKA_CONSUMER_THREADS:1}"

    security_protocol => "${KAFKA_SECURITY_PROTOCOL:SASL_SSL}"
    sasl_mechanism => "${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}"
    sasl_jaas_config => "org.apache.kafka.common.security.scram.ScramLoginModule required username='${KAFKA_USERNAME:kafka-cern-user-uccollect-external-community}' password='${KAFKA_PWD}';"

    # The broker is a Strimzi cluster with its own self-signed CA, so the ESnet
    # cluster CA has to be mounted in; the JDK default truststore does not chain to it.
    ssl_truststore_location => "${KAFKA_TRUSTSTORE:/usr/share/logstash/certs/kafka-ca.pem}"
    ssl_truststore_type => "${KAFKA_TRUSTSTORE_TYPE:PEM}"

    # The broker certificate carries only the in-cluster names and broker IPs as SANs -
    # there is no SAN for message-exchange.es.net - so hostname verification cannot
    # succeed against the public name. Trust stays pinned to the cluster CA above.
    # Set this to "https" to re-enable verification if ESnet adds the SAN.
    ssl_endpoint_identification_algorithm => "${KAFKA_SSL_ENDPOINT_ID_ALGO:}"

    codec => json
  }
}

filter {
  mutate {
    remove_field => [ "collector_id", "message_id", "message", "syslog_message", "syslog_pri", "event", "flow_fingerprint", "[host][name]", "syslog_version" ]
  }


  memcached {
    hosts => ["memcached"]
    get => {
      "exp_%{[context][experiment-id]}" => "[context][experiment]"
      "exp_%{[context][experiment-id]}_act_%{[context][activity-id]}" => "[context][activity]"
    }
  }

  if "_jsonparsefailure" not in [tags] {
    mutate {
      remove_field => [ "tags" ]
    }
  }

  # Convert Java Duration.toString() output (e.g. "PT-0.000311516S") to milliseconds.
  ruby {
    code => '
      %w(read-idle write-active write-idle read-active).each do |name|
        field = "[storage-stats][#{name}]"
        value = event.get(field)
        next if value.nil?

        m = /^PT(?:(-?\d+)H)?(?:(-?\d+)M)?(?:(-?[\d.]+)S)?$/.match(value.to_s)
        next unless m

        hours, minutes, seconds = m[1].to_f, m[2].to_f, m[3].to_f
        event.set(field, (hours * 3600 + minutes * 60 + seconds) * 1000.0)
      end
    '
  }

  # Enrich [src] and [dst] with rcsite/netroute/country/tier looked up from CRIC
  # netroute data, keyed by [flow-id][src-ip] / [flow-id][dst-ip] and [flow-id][afi].
  # The lookup table is fetched once at startup, cached to disk, and refreshed
  # hourly in a background thread so per-event lookups never block on I/O.
  ruby {
    init => '
      require "ipaddr"
      require "json"
      require "net/http"
      require "uri"

      @cric_url   = URI("https://wlcg-cric.cern.ch/api/core/rcsite/query/list/?json")
      @cric_cache = "/usr/share/logstash/data/cric_rcsite.json"   # last good copy, survives restarts
      @cric_every = 3600                                           # refresh interval, seconds
      @cric_tables = nil

      # fam => [[prefix_len, mask_int, { network_int => info }], ...] sorted longest prefix first
      def cric_build_tables(data)
        raw = { 4 => {}, 6 => {} }
        data.each do |site, s|
          (s["netroutes"] || {}).each do |route, r|
            (r["networks"] || {}).each do |_fam, list|
              Array(list).each do |cidr|
                ip = (IPAddr.new(cidr.to_s.strip) rescue nil)   # IPAddr masks to the network address
                next unless ip
                fam = ip.ipv6? ? 6 : 4
                (raw[fam][ip.prefix] ||= {})[ip.to_i] ||= {
                  "rcsite"   => site,
                  "netroute" => route,
                  "country"  => s["country"],
                  "tier"     => s["rc_tier_level"]
                }
              end
            end
          end
        end
        raw.map do |fam, by_len|
          bits = fam == 6 ? 128 : 32
          full = (1 << bits) - 1
          [fam, by_len.sort_by { |pl, _| -pl }.map { |pl, h| [pl, full ^ ((1 << (bits - pl)) - 1), h] }]
        end.to_h
      end

      def cric_fetch
        res = Net::HTTP.start(@cric_url.host, @cric_url.port, use_ssl: true,
                              open_timeout: 15, read_timeout: 180) { |h| h.get(@cric_url.request_uri) }
        raise "CRIC HTTP #{res.code}" unless res.is_a?(Net::HTTPSuccess)
        tables = cric_build_tables(JSON.parse(res.body))   # parse before caching, so a bad body never overwrites the cache
        File.write(@cric_cache + ".tmp", res.body)
        File.rename(@cric_cache + ".tmp", @cric_cache)
        tables
      end

      def cric_count(t)
        t.values.flatten(1).sum { |_pl, _m, h| h.size }
      end

      # Startup: try CRIC, fall back to cached copy
      begin
        @cric_tables = cric_fetch
      rescue => e
        @logger.warn("CRIC fetch failed at startup, using cache", error: e.message)
        begin
          @cric_tables = cric_build_tables(JSON.parse(File.read(@cric_cache)))
        rescue => e2
          @logger.error("No usable CRIC cache, lookups disabled until next refresh", error: e2.message)
        end
      end
      @logger.info("CRIC networks loaded", count: cric_count(@cric_tables)) if @cric_tables

      # Background refresh: builds a new table and swaps the reference, never blocks events
      Thread.new do
        loop do
          sleep @cric_every
          begin
            t = cric_fetch
            @cric_tables = t
            @logger.info("CRIC networks refreshed", count: cric_count(t))
          rescue => e
            @logger.warn("CRIC refresh failed, keeping previous table", error: e.message)
          end
        end
      end
    '

    code => '
      tables = @cric_tables
      afi = event.get("[flow-id][afi]").to_s
      fam = case afi
            when "ipv4" then 4
            when "ipv6" then 6
            end

      if tables && fam
        { "src" => "[flow-id][src-ip]", "dst" => "[flow-id][dst-ip]" }.each do |role, field|
          addr = event.get(field)
          next unless addr

          begin
            ip = IPAddr.new(addr.to_s.strip)
            x = ip.to_i
            hit = nil
            tables[fam].each do |_pl, mask, h|
              hit = h[x & mask]
              break if hit
            end
            if hit
              event.set("[#{role}][rcsite]", hit["rcsite"])
              event.set("[#{role}][netroute]", hit["netroute"])
              event.set("[#{role}][country]", hit["country"])
              event.set("[#{role}][tier]", hit["tier"])
            else
              event.tag("_cric_no_match_#{role}")
            end
          rescue IPAddr::Error, ArgumentError
            event.tag("_ip_parse_failure_#{role}")
          end
        end
      end
    '
  }
}

output {

  #  stdout {
  #    codec => rubydebug
  #  }

  if "_jsonparsefailure" in [tags] {
    file {
      path => "/var/log/logstash/json_parse_failure.txt"
    }
  }

  elasticsearch {
    hosts => "atlas-kibana.mwt2.org"
    ssl_enabled => true
    index => 'fireflies_write'
    user => "uc_logstash_indexer"
    password => "${LOGSTASH_PWD}"
  }

}
