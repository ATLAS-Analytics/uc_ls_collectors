input {
  http {
    host => "0.0.0.0"
    port => "8080"
    codec => json
  }
}

filter {
  # if [token] not in [ "ai_logger" ] {
  #   drop {}
  # }
  mutate {
    add_field => { "created_at" => "%{@timestamp}" }
    remove_field => [ "logger_name", "port", "type", "token", "headers", "host" ]
  }
}

output {

   stdout {
     codec => rubydebug
   }
  
  if "_jsonparsefailure" in [tags] {
    file {
      path => "/var/log/logstash/json_parse_failure.txt"
    }
  }
  
  elasticsearch {
    hosts => "atlas-kibana.mwt2.org"
    ssl_enabled => true
    index => 'af_assistant'
    user => "uc_logstash_indexer"
    password => "${LOGSTASH_PWD}"
  }

}