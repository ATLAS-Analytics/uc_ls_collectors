name: Build frontier Logstash dockerhub image

on:
  push:
    branches:
      - "netstat"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.netstat
          push: true
          tags: |
            atlasanalyticsservice/uc_ls_netstat:latest
            atlasanalyticsservice/uc_ls_netstat:${{ github.sha }}

      - name: Repository Dispatch
        env:
          GH_TOKEN: ${{ secrets.AAAS_GITOPS_DEPLOY_TRIGGER }}
        run: |
          gh api repos/maniaclab/flux_apps/dispatches \
            -f event_type=gitops-uc-ls-netstat-app-trigger \
            -f "client_payload[ref]=${{ github.ref }}" \
            -f "client_payload[sha]=${{ github.sha }}"
