name: Build frontier Logstash dockerhub image

on:
  push:
    branches:
      - "netstat"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Docker Build & Push Action
        uses: mr-smithers-excellent/docker-build-push@v7
        with:
          image: atlasanalyticsservice/uc_ls_frontier
          dockerfile: Dockerfile.netstat
          tags: latest, ${{ github.sha }}
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4.0.0
        with:
          token: ${{ secrets.AAAS_GITOPS_DEPLOY_TRIGGER }}
          repository: maniaclab/flux_apps
          event-type: gitops-uc-ls-netstat-app-trigger
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
