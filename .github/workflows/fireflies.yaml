name: Build fireflies Logstash dockerhub image

on:
  push:
    branches:
      - "fireflies"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: atlasanalyticsservice/uc_ls_fireflies
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=uc_ls_fireflies
            org.opencontainers.image.vendor=ATLAS Analytics Service

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.fireflies
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Repository Dispatch
        env:
          GH_TOKEN: ${{ secrets.AAAS_GITOPS_DEPLOY_TRIGGER }}
        run: |
          gh api repos/maniaclab/flux_apps/dispatches \
            -f event_type=gitops-uc-ls-fireflies-app-trigger \
            -F "client_payload[ref]=${{ github.ref }}" \
            -F "client_payload[sha]=${{ github.sha }}"
