name: Build xCache gStream Logstash dockerhub image

on:
  push:
    branches:
      - "ixcache"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ixcache
          push: true
          tags: |
            atlasanalyticsservice/uc_ls_ixcache:latest
            atlasanalyticsservice/uc_ls_ixcache:${{ github.sha }}

      - name: Repository Dispatch
        env:
          GH_TOKEN: ${{ secrets.AAAS_GITOPS_DEPLOY_TRIGGER }}
        run: |
          gh api repos/maniaclab/flux_apps/dispatches \
            -f event_type=gitops-uc-ls-ixcache-trigger \
            -f "client_payload[ref]=${{ github.ref }}" \
            -f "client_payload[sha]=${{ github.sha }}"
